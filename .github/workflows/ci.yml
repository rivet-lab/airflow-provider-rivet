name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: pre-commit hooks on every file (ruff check, ruff format, file checks)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
      - name: push guard self-test
        run: python3 dev/push_guard.py --self-test
      - name: files deleted by this change stay under the ceiling
        run: python3 dev/push_guard.py --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}"
      - name: gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --redact --verbose /repo

  locked:
    name: Tests (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rivet-lab/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - run: uv sync --locked
      - run: uv run pytest -q --junitxml=junit.xml
        env:
          RIVET_SRC: rivet
      - name: Every skip of the locked job is in its ledger (dev/skip_census.py)
        run: python3 dev/skip_census.py junit.xml --job locked

  airflow:
    name: Airflow ${{ matrix.airflow }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { airflow: "2.10.5", python: "3.12" }
          - { airflow: "3.3.2", python: "3.12" }
          - { airflow: "3.3.2", python: "3.13" }
          - { airflow: "3.3.2", python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rivet-lab/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Install Airflow ${{ matrix.airflow }} under its constraints, then the package
        # The rivet-cli under test is the minimum the package admits, read from MIN_RIVET_VERSION (dev/min_rivet.py), and
        # tests/test_fake_rivet.py holds the fake binary to exactly that version's flags.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install "apache-airflow==${{ matrix.airflow }}" apache-airflow-providers-slack "rivet-cli==$(python3 dev/min_rivet.py)" pytest "hypothesis==6.170.14" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-${{ matrix.python }}.txt"
          uv pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q --junitxml=junit.xml
        env:
          RIVET_SRC: rivet
      - name: Every skip of the Airflow job is in its ledger (dev/skip_census.py)
        run: python3 dev/skip_census.py junit.xml --job airflow

  gate-oracles:
    name: Gate oracles on Airflow ${{ matrix.airflow }} (RED on every mutant)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        airflow: ["2.10.5", "3.3.2"]
    env:
      RIVET_GATE_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Gate group, then Airflow beside it (the DAG-spec oracles build the real DAG file)
        run: |
          uv sync --python 3.12 --only-group gate
          uv pip install --python .venv/bin/python "apache-airflow==${{ matrix.airflow }}" apache-airflow-providers-slack
      - run: .venv/bin/python -m pytest -q gate/tests --junitxml=junit.xml
      - name: Every skip of the gate oracles is in its ledger (dev/skip_census.py)
        run: python3 dev/skip_census.py junit.xml --job gate-oracles

  plan-seeded:
    name: What this pull request seeds
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(airflow_provider_rivet/|tests/|gate/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  seeded:
    name: Seeded-defect recall (shard ${{ matrix.shard }} of 4)
    needs: plan-seeded
    if: needs.plan-seeded.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RIVET_SRC: rivet
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: rivet-lab/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Gate group, then Airflow beside it (the cells build the DAG files)
        run: |
          uv sync --python 3.12 --locked --group gate
          uv pip install --python .venv/bin/python "apache-airflow==3.3.2" apache-airflow-providers-slack
      - name: Every seed is caught by a cell it names (dev/seeded/seeds.yaml)
        run: .venv/bin/python -m dev.seeded --shard ${{ matrix.shard }}/4

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - run: uv build
      - run: uvx twine check dist/*
