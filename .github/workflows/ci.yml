name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: pre-commit hooks on every file (ruff check, ruff format, file checks)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks
      - name: gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --redact --verbose /repo

  locked:
    name: Tests (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: panchenkoai/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          RIVET_SRC: rivet

  airflow:
    name: Airflow ${{ matrix.airflow }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { airflow: "2.10.5", python: "3.12" }
          - { airflow: "3.3.2", python: "3.12" }
          - { airflow: "3.3.2", python: "3.13" }
          - { airflow: "3.3.2", python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: panchenkoai/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Install Airflow ${{ matrix.airflow }} under its constraints, then the package
        # The rivet-cli under test is the minimum the package admits, read from MIN_RIVET_VERSION (dev/min_rivet.py), and
        # tests/test_fake_rivet.py holds the fake binary to exactly that version's flags.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install "apache-airflow==${{ matrix.airflow }}" apache-airflow-providers-slack "rivet-cli==$(python3 dev/min_rivet.py)" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow }}/constraints-${{ matrix.python }}.txt"
          uv pip install --no-deps -e .
      - run: .venv/bin/python -m pytest -q
        env:
          RIVET_SRC: rivet

  gate-oracles:
    name: Gate oracles (RED on every mutant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - run: uv run --only-group gate python -m pytest -q gate/tests

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - run: uv build
      - run: uvx twine check dist/*
