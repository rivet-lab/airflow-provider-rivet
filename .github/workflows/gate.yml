name: Live gate

# The live Airflow gate (python -m gate) against a released rivet binary: on demand, and before a provider release.
# rivet's own release gate does not run it: rivet has no hook for this scenario.

on:
  workflow_dispatch:
    inputs:
      rivet:
        description: "rivet release tag (default: the latest release)"
        required: false
  push:
    tags: ["airflow-v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Airflow 2.10.5 and 3.3.2 on rivet ${{ inputs.rivet || 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - name: Download the rivet Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        # The image is Debian 12 (glibc 2.36): the plain `-linux-gnu` asset needs glibc 2.38+ and cannot start there,
        # so the `-glibc2.28` asset every release from 0.32 on carries is the one taken.
        run: |
          tag="${{ inputs.rivet }}"
          [ -n "$tag" ] || tag=$(gh release view -R rivet-lab/rivet --json tagName -q .tagName)
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          # An older binary than the provider admits is refused: the minimum is MIN_RIVET_VERSION (dev/min_rivet.py).
          min=v$(python3 dev/min_rivet.py)
          if [ "$(printf '%s\n' "$min" "$tag" | sort -V | head -1)" != "$min" ]; then
            echo "::error::rivet $tag is older than the minimum $min the gate runs against"; exit 1
          fi
          asset="rivet-$tag-x86_64-unknown-linux-gnu-glibc2.28.tar.gz"
          gh release download "$tag" -R rivet-lab/rivet -p "$asset" -D rivet-dl
          tar -xzf "rivet-dl/$asset" -C rivet-dl
          find rivet-dl -type f -name rivet -exec cp {} ./rivet-bin \;
          chmod +x rivet-bin
      - run: uv run --only-group gate python -m gate --rivet-bin ./rivet-bin --verdicts verdicts.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-verdicts
          path: verdicts.jsonl
          if-no-files-found: ignore
