name: Release

# A tag `airflow-v<version>` publishes that version to PyPI through Trusted Publishing (no token stored here).
# The tag must equal `airflow-v` + airflow_provider_rivet.__version__; the `pypi` environment gates the upload.
# The full mutation run is not part of a release (owner, 2026-10-18): it runs on pull requests (targeted) and by hand.

on:
  push:
    tags: ["airflow-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: uv
      - uses: actions/checkout@v7
        with:
          repository: rivet-lab/rivet
          path: rivet
          sparse-checkout: |
            tests/fixtures/scheduler
            src/config
            src/cli
      - name: Pin rivet to RIVET_CONTRACT_REF
        run: git -C rivet fetch --depth 1 origin "$(cat RIVET_CONTRACT_REF)" && git -C rivet checkout --quiet FETCH_HEAD
      - name: Tests on the locked environment
        run: uv sync --locked && uv run pytest -q
        env:
          RIVET_SRC: rivet
      - name: The tag names the package version, and the changelog dates it
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('airflow_provider_rivet/__init__.py').read_text()).group(1))")
          test "${GITHUB_REF_NAME}" = "airflow-v${version}" || { echo "tag ${GITHUB_REF_NAME} != airflow-v${version}"; exit 1; }
          grep -E "^## ${version} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md || { echo "CHANGELOG.md has no dated '## ${version} (YYYY-MM-DD)' heading"; exit 1; }
      - run: rm -rf rivet && uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/airflow-provider-rivet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
