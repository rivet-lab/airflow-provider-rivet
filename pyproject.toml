[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-rivet"
dynamic = ["version"]
description = "Apache Airflow operators and DAG builders that run the rivet binary on the worker"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Andrii Panchenko" }]
keywords = ["airflow", "airflow-provider", "rivet", "etl", "cdc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["apache-airflow>=2.10", "rivet-cli>=0.32.2"]

[project.optional-dependencies]
slack = ["apache-airflow-providers-slack>=8.0"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4", "ruff==0.17.1"]
gate = ["duckdb>=1.1", "pytz", "pytest>=8", "pyyaml>=6", "google-cloud-bigquery>=3.25", "snowflake-connector-python>=3.12", "pymongo>=4.8", "oracledb>=2.4"]

[tool.uv]
required-version = ">=0.6.3"

[project.urls]
Homepage = "https://github.com/panchenkoai/airflow-provider-rivet"
Source = "https://github.com/panchenkoai/airflow-provider-rivet"
Issues = "https://github.com/panchenkoai/airflow-provider-rivet/issues"
rivet = "https://github.com/panchenkoai/rivet"

[project.entry-points.apache_airflow_provider]
provider_info = "airflow_provider_rivet:get_provider_info"

[tool.hatch.version]
path = "airflow_provider_rivet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["airflow_provider_rivet"]

[tool.hatch.build.targets.sdist]
include = ["airflow_provider_rivet", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["gate/stand/airflow-*.yaml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
ignore = ["E501"]  # the formatter owns line length; long string literals stay as written

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mutmut]
# Mutation testing (docs/development.md, "Mutation testing"; run by `make mutants`): only the product package is mutated —
# not tests/, gate/, examples/ or quickstart/, which are copied so the documentation tests that read them still run.
source_paths = ["airflow_provider_rivet/"]
also_copy = ["README.md", "CHANGELOG.md", "LICENSE", "RIVET_CONTRACT_REF", ".github/", "docs/", "examples/", "gate/", "dev/", "quickstart/"]
# Workers fork from a server that only collected the tests: a process that has already RUN the suite (mutmut's
# default `fork`) hangs on macOS when forked, and Airflow's dags folder is fixed by the first session's AIRFLOW_HOME.
process_isolation = "forkserver"
# mutmut's CPU-time limit per mutant is 15x the tests' measured time plus this constant; the measured time leaves out
# what every worker pays first (a fresh pytest session, Airflow's `resetdb` for the DAG-run tests), so with the
# default 1 s a slow-but-finite run of a fast function read as `timeout` (all 20 timeouts of format_failure).
timeout_constant = 60
# dev/mutmut_isolation.py: a metadata database, a dags folder and a base temp directory per worker process.
pytest_add_cli_args = ["-p", "no:cacheprovider", "-p", "mutmut_isolation"]
