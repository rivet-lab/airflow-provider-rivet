<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Apache Airflow runs rivet as tasks (plan, apply, load, compact): PostgreSQL, MySQL, SQL Server, MongoDB and Oracle (preview) flow through rivet, batch or CDC, to S3, GCS, Azure Blob or local disk, then into BigQuery, Snowflake or ClickHouse (preview)">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2ff"/>
      <stop offset="0.55" stop-color="#6f9be0"/>
      <stop offset="1" stop-color="#2f5fae"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cap { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #59636e; }
      .pill { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
      .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
      .label { font-size: 15px; font-weight: 500; fill: #424a53; }
      .edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
      .head { fill: #8c959f; }
      .note { font-size: 11.5px; fill: #59636e; }
      .dot { fill: #6f9be0; }
      .node { fill: #eef4fd; stroke: #9dbbe8; stroke-width: 1.5; }
      .halo { fill: #253a5e; }
      .brand { font-size: 21px; font-weight: 800; letter-spacing: 1px; fill: #2f4a73; }
      .chip { fill: #ffffff; stroke: #9dbbe8; stroke-width: 1; }
      .chiptext { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #2f5fae; }
      .hint { font-size: 12px; font-weight: 500; fill: #2f5fae; }
      .muted { font-size: 11.5px; fill: #59636e; }
      .af { fill: #eaf7f0; stroke: #2fa36b; stroke-width: 1.5; }
      .aftitle { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; fill: #1f7a4f; }
    </style>
  </defs>

  <!-- column captions -->
  <text class="cap" x="115" y="26" text-anchor="middle">SOURCES</text>
  <text class="cap" x="400" y="26" text-anchor="middle">EXTRACT</text>
  <text class="cap" x="645" y="26" text-anchor="middle">STORAGE</text>
  <text class="cap" x="892" y="26" text-anchor="middle">WAREHOUSE</text>

  <!-- sources -->
  <rect class="pill" x="30" y="44" width="170" height="34" rx="17"/>
  <text class="label" x="115" y="66" text-anchor="middle">PostgreSQL</text>
  <rect class="pill" x="30" y="90" width="170" height="34" rx="17"/>
  <text class="label" x="115" y="112" text-anchor="middle">MySQL</text>
  <rect class="pill" x="30" y="136" width="170" height="34" rx="17"/>
  <text class="label" x="115" y="158" text-anchor="middle">SQL Server</text>
  <rect class="pill" x="30" y="182" width="170" height="34" rx="17"/>
  <text class="label" x="115" y="204" text-anchor="middle">MongoDB</text>
  <rect class="pill" x="30" y="228" width="170" height="34" rx="17"/>
  <text class="label" x="115" y="250" text-anchor="middle">Oracle <tspan class="muted">preview</tspan></text>

  <!-- sources converge on rivet -->
  <path class="edge" d="M200,61 C265,61 270,153 328,153"/>
  <path class="edge" d="M200,107 C265,107 270,153 328,153"/>
  <path class="edge" d="M200,153 C265,153 270,153 328,153"/>
  <path class="edge" d="M200,199 C265,199 270,153 328,153"/>
  <path class="edge" d="M200,245 C265,245 270,153 328,153"/>

  <!-- Apache Airflow frame around rivet -->
  <rect class="af" x="310" y="40" width="180" height="232" rx="20"/>
  <!-- Apache Airflow pinwheel (the "Airflow Pin" icon of Airflow 3's UI, viewBox 0 0 35 35) -->
  <g transform="translate(322,49) scale(0.63)">
    <path d="M0.861099 35.3873L17.7729 18.0515C17.8788 17.9429 17.8991 17.775 17.8108 17.6516C16.782 16.2156 14.8848 15.9667 14.1814 15.002C12.0981 12.1441 11.5695 10.5266 10.6743 10.6269C10.6117 10.6339 10.556 10.6676 10.512 10.7126L4.4026 16.9752C0.887961 20.5779 0.383943 28.5103 0.291509 35.1524C0.287333 35.4525 0.651482 35.6021 0.861099 35.3873Z" fill="#017cee"/>
    <path d="M35.4734 34.9588L18.1375 18.047C18.0289 17.941 17.861 17.9207 17.7377 18.0091C16.3017 19.0378 16.0528 20.9351 15.088 21.6384C12.2302 23.7217 10.6126 24.2504 10.7129 25.1456C10.72 25.2082 10.7536 25.2639 10.7987 25.3077L17.0613 31.4172C20.664 34.9319 28.5964 35.4359 35.2385 35.5282C35.5386 35.5326 35.6882 35.1684 35.4734 34.9588Z" fill="#00ad46"/>
    <path d="M17.0612 31.4173C15.0932 29.4975 14.1801 25.6994 17.953 17.8671C11.8213 20.6074 9.67257 24.2094 10.7296 25.2407L17.0612 31.4173Z" fill="#04d659" fill-rule="evenodd" clip-rule="evenodd"/>
    <path d="M35.0445 0.346896L18.1327 17.6827C18.0268 17.7913 18.0065 17.9592 18.0948 18.0825C19.1236 19.5186 21.0209 19.7674 21.724 20.7322C23.8075 23.59 24.3362 25.2075 25.2313 25.1074C25.2938 25.1004 25.3496 25.0666 25.3936 25.0216L31.5029 18.759C35.0177 15.1562 35.5217 7.22392 35.6141 0.58175C35.6182 0.281597 35.2541 0.132024 35.0445 0.346896Z" fill="#00c7d4"/>
    <path d="M31.5031 18.759C29.5832 20.7269 25.7851 21.6401 17.9528 17.8671C20.693 23.9988 24.2951 26.1477 25.3263 25.0905L31.5031 18.759Z" fill="#11e1ee" fill-rule="evenodd" clip-rule="evenodd"/>
    <path d="M0.432658 0.775339L17.7685 17.6871C17.8771 17.793 18.045 17.8134 18.1683 17.725C19.6043 16.6963 19.8532 14.799 20.8179 14.0957C23.6759 12.0123 25.2934 11.4837 25.193 10.5885C25.186 10.526 25.1523 10.4702 25.1074 10.4263L18.8447 4.31685C15.242 0.802203 7.30967 0.298184 0.667512 0.205751C0.367359 0.201573 0.217786 0.565722 0.432658 0.775339Z" fill="#e43921"/>
    <path d="M18.8446 4.31675C20.8125 6.23662 21.7257 10.0346 17.9528 17.8669C24.0844 15.1267 26.2333 11.5246 25.1761 10.4934L18.8446 4.31675Z" fill="#ff7557" fill-rule="evenodd" clip-rule="evenodd"/>
    <path d="M4.4028 16.9752C6.32267 15.0072 10.1207 14.0942 17.953 17.867C15.2128 11.7354 11.6107 9.58661 10.5795 10.6437L4.4028 16.9752Z" fill="#0cb6ff" fill-rule="evenodd" clip-rule="evenodd"/>
  </g>
  <text class="aftitle" x="351" y="64">APACHE AIRFLOW</text>

  <!-- rivet -->
  <rect class="node" x="330" y="98" width="140" height="110" rx="24"/>
  <circle class="halo" cx="362" cy="148" r="17"/>
  <ellipse cx="362" cy="143" rx="10.5" ry="4" fill="url(#steel)"/>
  <rect x="358.5" y="145" width="7" height="12" rx="2" fill="url(#steel)"/>
  <text class="brand" x="385" y="159">RIVET</text>
  <rect class="chip" x="345" y="174" width="52" height="20" rx="10"/>
  <text class="chiptext" x="371" y="188" text-anchor="middle">BATCH</text>
  <rect class="chip" x="403" y="174" width="52" height="20" rx="10"/>
  <text class="chiptext" x="429" y="188" text-anchor="middle">CDC</text>
  <text class="hint" x="400" y="234" text-anchor="middle">plan → apply</text>
  <text class="hint" x="400" y="252" text-anchor="middle">→ load → compact</text>

  <!-- rivet -> storage -->
  <path class="edge" d="M470,153 L556,153" marker-end="url(#arrow)"/>
  <text class="note" x="524" y="130" text-anchor="middle">Parquet</text>
  <text class="note" x="524" y="144" text-anchor="middle">CSV</text>

  <!-- storage -->
  <rect class="card" x="560" y="50" width="170" height="206" rx="16"/>
  <circle class="dot" cx="590" cy="85" r="3.5"/>
  <text class="label" x="604" y="90">Amazon S3</text>
  <circle class="dot" cx="590" cy="130" r="3.5"/>
  <text class="label" x="604" y="135">Google Cloud</text>
  <circle class="dot" cx="590" cy="175" r="3.5"/>
  <text class="label" x="604" y="180">Azure Blob</text>
  <circle class="dot" cx="590" cy="220" r="3.5"/>
  <text class="label" x="604" y="225">Local disk</text>

  <!-- storage -> warehouse -->
  <path class="edge" d="M730,153 L806,153" marker-end="url(#arrow)"/>

  <!-- warehouse -->
  <rect class="card" x="810" y="62" width="165" height="182" rx="16"/>
  <circle class="dot" cx="836" cy="91" r="3.5"/>
  <text class="label" x="850" y="96">BigQuery</text>
  <text class="muted" x="850" y="114">load + compact</text>
  <circle class="dot" cx="836" cy="146" r="3.5"/>
  <text class="label" x="850" y="151">Snowflake</text>
  <text class="muted" x="850" y="169">load</text>
  <circle class="dot" cx="836" cy="201" r="3.5"/>
  <text class="label" x="850" y="206">ClickHouse</text>
  <text class="muted" x="850" y="224">load · preview</text>
</svg>
