# Generated by rivet init — SQL Server schema "dbo" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: mssql
  url_env: RIVET_GATE_MSSQL_URL  # reads the variable you already exported
  tls: { mode: require }

# One export per table/view — per-table prefix `exports/<name>/` under the given bucket; review
# modes before running.
exports:
  - name: gate_customers_cdc
    # change data capture — reads the transaction log (grants: docs/reference/cdc.md)
    table: dbo.gate_customers
    mode: cdc
    format: parquet
    cdc:
      checkpoint: ./cdc/rivet_gate_customers.ckpt  # resume position; keep it (semantics of omitting
      # differ per engine — see cdc.md)
      until_current: true  # drain to the current log end and exit (good for a scheduler)
      initial: snapshot  # first run: anchor, then read the whole table as the baseline; later runs
      # take only changes
      capture_instance: dbo_gate_customers  # the instance cdc.change_tables holds for this table;
      # needs SQL Server Agent
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/rivet/gate_customers_cdc/
  - name: gate_orders_cdc
    # change data capture — reads the transaction log (grants: docs/reference/cdc.md)
    table: dbo.gate_orders
    mode: cdc
    format: parquet
    cdc:
      checkpoint: ./cdc/rivet_gate_orders.ckpt  # resume position; keep it (semantics of omitting
      # differ per engine — see cdc.md)
      until_current: true  # drain to the current log end and exit (good for a scheduler)
      initial: snapshot  # first run: anchor, then read the whole table as the baseline; later runs
      # take only changes
      capture_instance: gate_orders_v2  # the instance cdc.change_tables holds for this table; needs
      # SQL Server Agent
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/rivet/gate_orders_cdc/
    columns:
      amount: decimal(12,2)

# The warehouse half of the cycle: `rivet load` fills it, `rivet compact` merges.
# Review every value below — they are guesses from the catalog, not decisions.
load:
  target: bigquery
  project: rivet-data-tool
  dataset: rivet_tmp_afgate_ds_mssql_cdc
  pk: auto  # the source primary key `rivet run` recorded
  cluster_by: auto
  # base_buffer: `<table>` is a physical table and `<table>__changes` a
  # disposable buffer `rivet compact` merges into it. Drop this key to keep
  # a changelog plus a dedup view instead (no compaction, full scan per read).
  layout: base_buffer
  cleanup_source: true
