# Generated by rivet init — PostgreSQL schema "public" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: postgres
  url_env: RIVET_GATE_SOURCE_URL  # reads the variable you already exported
  tls: { mode: disable }  # explicit remote-plaintext opt-in (--tls disable): only on a trusted
  # network path

# One export per table/view — per-table prefix `exports/<name>/` under the given bucket; review
# modes before running.
exports:
  - name: gate_customers
    query: >
      SELECT "id", "name", "tier", "updated_at"
      FROM "gate_customers"
    # ~1K rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'updated_at'
    mode: incremental
    cursor_column: updated_at
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: gate-s3-batch
      prefix: exports/gate_customers/
      region: us-east-1
  - name: gate_orders
    query: >
      SELECT "id", "customer_id", "amount", "status", "updated_at"
      FROM "gate_orders"
    # ~5K rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'updated_at'
    mode: incremental
    cursor_column: updated_at
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: gate-s3-batch
      prefix: exports/gate_orders/
      region: us-east-1
    columns:
      amount: decimal(12,2)
