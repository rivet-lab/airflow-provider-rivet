# Generated by rivet init — Oracle schema "(current schema)" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: oracle
  url_env: RIVET_GATE_ORACLE_URL  # reads the variable you already exported
  tls: { mode: disable }  # explicit remote-plaintext opt-in (--tls disable): only on a trusted
  # network path

# One export per table/view — per-table prefix `exports/<name>/` under the given bucket; review
# modes before running.
exports:
  - name: GATE_CUSTOMERS_cdc
    # change data capture — reads the transaction log (grants: docs/reference/cdc.md)
    table: RIVET.GATE_CUSTOMERS
    mode: cdc
    format: parquet
    cdc:
      checkpoint: ./cdc/rivet_GATE_CUSTOMERS.ckpt  # resume position; keep it (semantics of omitting
      # differ per engine — see cdc.md)
      until_current: true  # drain to the current log end and exit (good for a scheduler)
      initial: snapshot  # first run: anchor, then read the whole table as the baseline; later runs
      # take only changes
      # LogMiner (preview): the table needs ALTER TABLE RIVET.GATE_CUSTOMERS ADD SUPPLEMENTAL LOG
      # DATA (ALL) COLUMNS; the user is a common C## user
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/rivet/GATE_CUSTOMERS_cdc/
  - name: GATE_ORDERS_cdc
    # change data capture — reads the transaction log (grants: docs/reference/cdc.md)
    table: RIVET.GATE_ORDERS
    mode: cdc
    format: parquet
    cdc:
      checkpoint: ./cdc/rivet_GATE_ORDERS.ckpt  # resume position; keep it (semantics of omitting
      # differ per engine — see cdc.md)
      until_current: true  # drain to the current log end and exit (good for a scheduler)
      initial: snapshot  # first run: anchor, then read the whole table as the baseline; later runs
      # take only changes
      # LogMiner (preview): the table needs ALTER TABLE RIVET.GATE_ORDERS ADD SUPPLEMENTAL LOG DATA
      # (ALL) COLUMNS; the user is a common C## user
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/rivet/GATE_ORDERS_cdc/
    columns:
      AMOUNT: decimal(12,2)

# No `load:` block: loading an Oracle CDC stream is not supported yet: the Oracle CDC preview
# captures to files only (ADR-0037); load its parts with your own tooling.
# `rivet run` still captures every table to Parquet under its `destination:`.
