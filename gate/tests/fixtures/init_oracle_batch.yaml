# Generated by rivet init — Oracle schema "(current schema)" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: oracle
  url_env: RIVET_GATE_ORACLE_URL  # reads the variable you already exported
  tls: { mode: disable }  # explicit remote-plaintext opt-in (--tls disable): only on a trusted
  # network path

# One export per table/view — per-table prefix `exports/<name>/` under the given bucket; review
# modes before running.
exports:
  - name: GATE_CUSTOMERS
    query: >
      SELECT "ID", "NAME", "TIER", "UPDATED_AT"
      FROM "RIVET"."GATE_CUSTOMERS"
    # ~1K rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'UPDATED_AT'
    mode: incremental
    cursor_column: UPDATED_AT
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/GATE_CUSTOMERS/
    load:
      partition: { column: UPDATED_AT, granularity: day }  # day holds ~4,000 partitions (11 years);
      # use month for a longer history
  - name: GATE_ORDERS
    query: >
      SELECT "ID", "CUSTOMER_ID", "AMOUNT", "STATUS", "PLACED_AT", "PAYLOAD", "DOC", "UPDATED_AT"
      FROM "RIVET"."GATE_ORDERS"
    # ~5K rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'UPDATED_AT'
    mode: incremental
    cursor_column: UPDATED_AT
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: gcs
      bucket: rivet-afgate-bucket
      prefix: exports/GATE_ORDERS/
    columns:
      AMOUNT: decimal(12,2)
    load:
      partition: { column: PLACED_AT, granularity: day }  # day holds ~4,000 partitions (11 years);
      # use month for a longer history

# The warehouse half of the cycle: `rivet load` fills it, `rivet compact` merges.
# Review every value below — they are guesses from the catalog, not decisions.
load:
  target: bigquery
  project: rivet-data-tool
  dataset: rivet_tmp_afgate_ds
  pk: auto  # the source primary key `rivet run` recorded
  cluster_by: auto
  # base_buffer: `<table>` is a physical table and `<table>__changes` a
  # disposable buffer `rivet compact` merges into it. Drop this key to keep
  # a changelog plus a dedup view instead (no compaction, full scan per read).
  layout: base_buffer
  cleanup_source: true
