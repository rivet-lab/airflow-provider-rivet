# Generated by rivet init — PostgreSQL schema "public" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: postgres
  url_env: RIVET_SOURCE_URL  # the DAG fills it from the pipeline's source Connection
  tls: { mode: disable }  # explicit remote-plaintext opt-in (--tls disable): only on a trusted
  # network path

# One CDC stream over ALL tables (one slot / one server_id) — review before running.
# The batch exports are the stream's baseline RECIPES (paired by table): they say HOW to read a
# table — keyset / range / full, as a batch export would — and the stream runs them once, after the
# anchor, into its own `snapshot/`. `rivet run` skips them on its own; `rivet run -e <table>`
# exports one alone.
exports:
  - name: customers
    table: customers
    # auto: ~1K rows below the 100K threshold, but pageable because chunk column 'id' is available.
    # NOTE: chunked re-reads the whole table each run — for scheduled re-runs, `mode: incremental`
    # on 'updated_at' pulls only changed rows
    mode: chunked
    chunk_by_key: id  # keyset (seek) — pages by ROWS, immune to sparse/huge/gappy keys
    chunk_size: 100000
    chunk_checkpoint: true  # crash-recovery: a crashed run resumes from the last committed key on
    # the next run (a clean re-run still does a full pass — never skips rows)
    # keyset_incremental: true # append-only ONLY — a clean re-run pulls just NEW keys (skips
    # already-exported). Silently misses updates on a mutable table; use `mode: incremental` there
    # keyset is sequential; for a DENSE key where you want parallel workers, use `chunk_column:
    # <key>` + `chunk_size` instead
    format: parquet
    parquet:
      row_group_strategy: auto
      target_row_group_mb: 128
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: postgres-cdc
      prefix: exports/customers/
      region: us-east-1
  - name: orders
    table: orders
    # auto: ~5K rows below the 100K threshold, but pageable because chunk column 'id' is available.
    # NOTE: chunked re-reads the whole table each run — for scheduled re-runs, `mode: incremental`
    # on 'updated_at' pulls only changed rows
    mode: chunked
    chunk_by_key: id  # keyset (seek) — pages by ROWS, immune to sparse/huge/gappy keys
    chunk_size: 100000
    chunk_checkpoint: true  # crash-recovery: a crashed run resumes from the last committed key on
    # the next run (a clean re-run still does a full pass — never skips rows)
    # keyset_incremental: true # append-only ONLY — a clean re-run pulls just NEW keys (skips
    # already-exported). Silently misses updates on a mutable table; use `mode: incremental` there
    # keyset is sequential; for a DENSE key where you want parallel workers, use `chunk_column:
    # <key>` + `chunk_size` instead
    format: parquet
    parquet:
      row_group_strategy: auto
      target_row_group_mb: 128
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: postgres-cdc
      prefix: exports/orders/
      region: us-east-1
    columns:
      amount: decimal(12,2)
  - name: public_cdc
    # CDC over ALL tables through ONE stream (grants: docs/reference/cdc.md)
    tables: [customers, orders]
    mode: cdc
    format: parquet
    cdc:
      backfill: auto  # baseline through the batch exports above (a table's recipe = the export
      # reading it), after the anchor — no gap
      until_current: true  # drain to the current log end and exit (good for a scheduler)
      slot: rivet_postgres_cdc_public_cdc  # ONE logical slot for the whole stream; source needs
      # wal_level=logical + a REPLICATION role
    destination:
      type: s3
      bucket: postgres-cdc
      prefix: postgres_cdc/cdc/
      region: us-east-1
    columns:
      "orders.amount": decimal(12,2)
    load:
      # Each table's warehouse partition, guessed from its own columns — ClickHouse advises month or
      # coarser; one INSERT block may touch at most 100 partitions
      tables:
        customers: { partition: { column: created_at, granularity: month } }
        orders: { partition: { column: created_at, granularity: month } }

# The warehouse half of the cycle: `rivet load` fills ClickHouse. A CDC table is
# a change log the engine collapses by key, read through the `<table>` view.
# Review every value below — they are guesses, not decisions.
load:
  target: clickhouse
  url: http://clickhouse:8123
  database: postgres_cdc
  user: loader
  password_env: CLICKHOUSE_PASSWORD
  pk: auto  # the source primary key `rivet run` recorded
  cluster_by: auto
  cleanup_source: true
