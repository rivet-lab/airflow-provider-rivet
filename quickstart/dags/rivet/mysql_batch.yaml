# Generated by rivet init — MySQL database "shop" (2 objects)
# Review and adjust before running: rivet check -c <this file>

source:
  type: mysql
  url_env: RIVET_SOURCE_URL  # the DAG fills it from the pipeline's source Connection
  tls: { mode: disable }  # explicit remote-plaintext opt-in (--tls disable): only on a trusted
  # network path

# One export per table/view — per-table prefix `exports/<name>/` under the given bucket; review
# modes before running.
exports:
  - name: customers
    query: >
      SELECT `id`, `name`, `tier`, `created_at`, `updated_at`
      FROM `customers`
    # ~7 rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'updated_at'
    mode: incremental
    cursor_column: updated_at
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: mysql-batch
      prefix: exports/customers/
      region: us-east-1
    load:
      partition: { column: created_at, granularity: month }  # ClickHouse advises month or coarser;
      # one INSERT block may touch at most 100 partitions
  - name: orders
    query: >
      SELECT `id`, `customer_id`, `amount`, `status`, `created_at`, `updated_at`
      FROM `orders`
    # ~5K rows below the 100K threshold; auto would pick `full`, written as incremental on
    # 'updated_at'
    mode: incremental
    cursor_column: updated_at
    format: parquet
    meta_columns:  # adds 2 columns to the output (drop this block to omit them)
      exported_at: true  # _rivet_exported_at: when the row was exported
      row_hash: true  # _rivet_row_hash: per-row hash for change detection
    destination:
      type: s3
      bucket: mysql-batch
      prefix: exports/orders/
      region: us-east-1
    columns:
      amount: decimal(12,2)
    load:
      partition: { column: created_at, granularity: month }  # ClickHouse advises month or coarser;
      # one INSERT block may touch at most 100 partitions

# The warehouse half of the cycle: `rivet load` fills ClickHouse. A CDC table is
# a change log the engine collapses by key, read through the `<table>` view.
# Review every value below — they are guesses, not decisions.
load:
  target: clickhouse
  url: http://clickhouse:8123
  database: mysql_batch
  user: loader
  password_env: CLICKHOUSE_PASSWORD
  pk: [id]  # declared: for a `query:` export `rivet run` records no key (rivet#679)
  cluster_by: auto
  cleanup_source: true
